spring.application.name=septicpath
gg.jte.development-mode=${GG_JTE_DEVELOPMENT_MODE:false}
gg.jte.use-precompiled-templates=${GG_JTE_USE_PRECOMPILED_TEMPLATES:true}

app.data.root=./data/raw
app.storage.root=./storage
app.site.base-url=${APP_SITE_BASE_URL:https://septicpath.com}
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.locale=en_US
spring.web.locale-resolver=fixed
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.document-ocr.enabled=${APP_DOCUMENT_OCR_ENABLED:true}
app.document-ocr.command=${APP_DOCUMENT_OCR_COMMAND:tesseract}
app.document-ocr.max-pages=${APP_DOCUMENT_OCR_MAX_PAGES:8}
app.document-ocr.dpi=${APP_DOCUMENT_OCR_DPI:200}
app.document-ocr.page-timeout-seconds=${APP_DOCUMENT_OCR_PAGE_TIMEOUT_SECONDS:12}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${APP_GMAIL_USERNAME:}
spring.mail.password=${APP_GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.closing-risk-notification.sender=${APP_GMAIL_USERNAME:}
app.closing-risk-notification.recipient=${APP_CLOSING_RISK_NOTIFICATION_EMAIL:shinhyeok22@gmail.com}
