name: Official source health

on:
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "data/raw/source_registry.csv"
      - "tools/check_source_health.py"
      - "tools/check-source-health.ps1"
      - "tools/test_check_source_health.py"
      - ".github/workflows/source-health.yml"

permissions:
  contents: read

concurrency:
  group: septic-source-health
  cancel-in-progress: true

jobs:
  check-sources:
    name: Official-source monitor (does not deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test source health policy
        run: python -m unittest tools/test_check_source_health.py

      - name: Check official source URLs
        run: python tools/check_source_health.py --fail-on-actionable

      - name: Upload source health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health-${{ github.run_id }}
          path: reports/source-health.json
          if-no-files-found: warn
          retention-days: 30

      - name: Explain workflow boundary
        if: always()
        run: |
          {
            echo "## Official-source monitor"
            echo "This workflow checks third-party government URLs and never deploys SepticPath."
            echo "A failure here means at least one official source needs review; check **Deploy OCI ARM64** separately for production deployment status."
          } >> "$GITHUB_STEP_SUMMARY"
