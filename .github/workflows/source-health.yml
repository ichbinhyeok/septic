name: Official source health

on:
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "data/raw/source_registry.csv"
      - "tools/check-source-health.ps1"
      - ".github/workflows/source-health.yml"

permissions:
  contents: read

concurrency:
  group: septic-source-health
  cancel-in-progress: true

jobs:
  check-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check official source URLs
        run: python tools/check_source_health.py --fail-on-dead

      - name: Upload source health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health-${{ github.run_id }}
          path: reports/source-health.json
          if-no-files-found: warn
          retention-days: 30
