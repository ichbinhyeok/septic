name: Temporary OCI St Marys parcel fetch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OCI_KEY }}

      - name: Add OCI host to known_hosts
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan "${OCI_HOST}" >> ~/.ssh/known_hosts

      - name: Fetch official St Marys County sources from OCI
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USERNAME }}
        run: |
          mkdir -p artifact
          ssh "${OCI_USER}@${OCI_HOST}" 'bash -s' > artifact/oci-stmarys.tar.gz <<'REMOTE'
          set -euo pipefail
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          fetch() {
            local name="$1"
            local url="$2"
            curl -fsSkL --max-time 60 -A "$agent" -D "$work_dir/$name.headers" -o "$work_dir/$name.body" "$url" || true
          }
          query() {
            local name="$1"
            local layer="$2"
            local where="$3"
            curl -fsSkG --max-time 60 -A "$agent" \
              --data-urlencode "where=$where" \
              --data-urlencode 'outFields=*' \
              --data-urlencode 'returnGeometry=true' \
              --data-urlencode 'f=json' \
              -D "$work_dir/$name.headers" -o "$work_dir/$name.json" \
              "$layer/query" || true
          }
          parcel='https://gis.stmaryscountymd.gov/server/rest/services/Public/Primary/MapServer/0'
          address='https://gis.stmaryscountymd.gov/server/rest/services/Public/Primary/MapServer/2'
          fetch parcel-layer "$parcel?f=pjson"
          fetch address-layer "$address?f=pjson"
          query parcel-by-account "$parcel" "SDE.IT_Parcels.ACCTID='1905008166'"
          query parcel-by-short-account "$parcel" "SDE.IT_Parcels.ACCTID LIKE '%05008166'"
          query parcel-by-address "$parcel" "SDE.IT_SDAT.Address LIKE '%37970%SENECA%'"
          query address-by-number "$address" "STREET_NUM=37970"
          fetch property-facts 'https://www.stmaryscountymd.gov/IT/GIS/05008166/PropertyFacts/'
          fetch tax-bills 'https://www.stmaryscountymd.gov/Treasurer/Taxes/05008166/Bills/'
          fetch sdat 'https://sdat.dat.maryland.gov/RealProperty/Pages/MDP_viewdetails.aspx?County=19&SearchType=ACCT&District=05&AccountNumber=008166'
          fetch docstar 'https://cloud11.docstar.com/Guest/?RequestId=14cd544c-10b7-eb11-8292-0a6b987d34c5&InstanceId=1629ed1b-e0ba-e811-815f-0eb61c6741a1&AutoRedirect=true#Retrieve/search/qs/PropertyID:05008166'
          tar -C "$work_dir" -czf - .
          REMOTE
          test -s artifact/oci-stmarys.tar.gz

      - name: Upload fetched files
        uses: actions/upload-artifact@v4
        with:
          name: oci-stmarys
          path: artifact/oci-stmarys.tar.gz
          retention-days: 1
          if-no-files-found: error
