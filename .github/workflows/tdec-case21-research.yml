name: Temporary TDEC case 21 research

on:
  push:
    branches:
      - research/tdec-case21-online

permissions:
  contents: read

jobs:
  query-from-oci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OCI_KEY }}

      - name: Add OCI host key
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan "${OCI_HOST}" >> ~/.ssh/known_hosts

      - name: Run public TDEC search from OCI
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USERNAME }}
        run: |
          scp tools/tdec_case21_research.py "${OCI_USER}@${OCI_HOST}:/tmp/tdec_case21_research.py"
          ssh "${OCI_USER}@${OCI_HOST}" 'rm -rf /tmp/tdec_case21_output && TDEC_OUTPUT=/tmp/tdec_case21_output python3 /tmp/tdec_case21_research.py'
          mkdir -p research-output
          scp -r "${OCI_USER}@${OCI_HOST}:/tmp/tdec_case21_output/." research-output/
          ssh "${OCI_USER}@${OCI_HOST}" 'rm -rf /tmp/tdec_case21_output /tmp/tdec_case21_research.py'

      - name: Upload research result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tdec-case21-research
          path: research-output
          if-no-files-found: warn
          retention-days: 1

