name: Temporary encrypted operations ledger recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OCI_KEY }}

      - name: Add OCI host to known_hosts
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan "${OCI_HOST}" >> ~/.ssh/known_hosts

      - name: Retrieve and encrypt the existing private operations files
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USERNAME }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p encrypted-recovery
          cat > /tmp/recovery-public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAta5fZfvp16VZ9Xuk5ppr
          D50SQBFkNnZYvLpwxhbS111OZ1c/ZmipXFj4HXCJeUkxM2exhXtE/ww/jWmH4yV+
          i8n8XHvcfGqlTmPoGRclgBbFKZZLcJAWjHGcKY4c1NXievYqNu6P0O6dKIxLnb08
          E8zf24YZ5iJNe9CMnto+RXsC0qkjcGRmpi3CMqbOW4dzUKjRYH6MKi8g1U5RVs6G
          JvFCP3gZAvw/32PK2Sjukb+nKIFNc7BrMlZUrro49fTj9wLEdRyMWGk8HcI81Vi+
          0XmODvQr4M8zorN+bggWN0kRBo7GkOihMfNBIsmi/CupJoiVXPVAlExhZLbVFEo2
          xao09PSoYxkr3xoWzERtYtTY1NuI1xkHFiq7E6853yDJYvwe2BcFtfj58dEyINOC
          cYnOt/1uNDNaT3rTy2H5HReUPpPKVrYn3Ya6bKf99GL22umzcxB7IU8jsOTEIwyk
          ++zWqxO0C/BoIuOeQuJsl7GVQrmIqTPViSn4Oggf9l9FAgMBAAE=
          -----END PUBLIC KEY-----
          EOF
          openssl rand -out /tmp/recovery-key.bin 32
          ssh "${OCI_USER}@${OCI_HOST}" 'bash -s' <<'EOF' \
            | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
                -pass file:/tmp/recovery-key.bin \
                -out encrypted-recovery/operations.tar.gz.enc
          set -euo pipefail
          OPERATIONS_DIR="$HOME/deploy/septic/storage/operations"
          test -s "$OPERATIONS_DIR/ledger.json"
          cd "$OPERATIONS_DIR"
          files=(ledger.json)
          if [ -f delivery-blocklist.json ]; then files+=(delivery-blocklist.json); fi
          sudo tar -czf - "${files[@]}"
          EOF
          openssl pkeyutl -encrypt -pubin -inkey /tmp/recovery-public.pem \
            -in /tmp/recovery-key.bin \
            -out encrypted-recovery/recovery-key.bin.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          sha256sum encrypted-recovery/* > encrypted-recovery/SHA256SUMS.txt
          rm -f /tmp/recovery-key.bin /tmp/recovery-public.pem

      - name: Upload encrypted recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-operations-ledger-recovery
          path: encrypted-recovery/
          if-no-files-found: error
          retention-days: 1
